name: CI (quality gate)

on:
  push:
    branches: [main, master, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Client · typecheck + lint + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4            # TODO(pin): @<sha>
        with: { persist-credentials: false }

      - uses: actions/setup-node@v4          # TODO(pin): @<sha>
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json   # ASSUMPTION: lockfile اینجاست

      - name: Install (frozen)
        working-directory: client
        run: |
          set -euo pipefail
          npm ci                              # B2: reproducible، نه npm install

      - name: Lint
        working-directory: client
        run: |
          set -euo pipefail
          npm run lint --if-present

      - name: Typecheck
        working-directory: client
        run: |
          set -euo pipefail
          npx tsc --noEmit

      - name: Test
        working-directory: client
        run: |
          set -euo pipefail
          npm run test --if-present

  server:
    name: Server · typecheck + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4            # TODO(pin): @<sha>
        with: { persist-credentials: false }

      # ASSUMPTION: سرور npm است. اگر bun.lockb داری، این سه step را به
      #   oven-sh/setup-bun@v2 + `bun install --frozen-lockfile` + `bun run test`
      # تغییر بده و npm را حذف کن. قفل روی یک package-manager حیاتی است (D1).
      - uses: actions/setup-node@v4          # TODO(pin): @<sha>
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json   # ASSUMPTION

      - name: Install (frozen)
        working-directory: server
        run: |
          set -euo pipefail
          npm ci

      - name: Typecheck
        working-directory: server
        run: |
          set -euo pipefail
          npx tsc --noEmit

      - name: Test
        working-directory: server
        run: |
          set -euo pipefail
          npx vitest run
