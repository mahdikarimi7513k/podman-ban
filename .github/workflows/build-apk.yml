name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      api_base:
        description: "آدرس سرور (بدون اسلش آخر)"
        required: true
        default: "https://ms.payam-coder.ir"
      app_id:
        description: "Package Name"
        required: true
        default: "ir.payamcoder.ms"
      app_name:
        description: "نام اپلیکیشن"
        required: true
        default: "مدرسه مجازی"
      version_name:
        description: "شماره نسخه"
        required: false
        default: "1.0.0"
      load_mode:
        description: "remote = لود مستقیم سایت (رفع مشکل کوکی) | local = بیلد داخلی"
        required: false
        default: "remote"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true

      - name: Install required SDK packages
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-35" \
            "build-tools;34.0.0" >/dev/null

      - name: Install ImageMagick
        run: |
          sudo apt-get update -y
          sudo apt-get install -y imagemagick

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install client deps
        working-directory: client
        run: |
          npm install -g npm@latest
          npm install

      - name: Build web assets
        working-directory: client
        run: npm run build
        env:
          VITE_API_BASE: ${{ inputs.api_base }}

      - name: Detect webDir
        working-directory: client
        run: |
          if [ -d dist ]; then W=dist
          elif [ -d build ]; then W=build
          elif [ -d out ]; then W=out
          else W=dist; fi
          echo "WEB_DIR=$W" >> $GITHUB_ENV
          echo "webDir = $W"

      - name: Write Capacitor config (fix package name)
        working-directory: client
        env:
          APP_ID: ${{ inputs.app_id }}
          APP_NAME: ${{ inputs.app_name }}
          WEB_DIR: ${{ env.WEB_DIR }}
          API_BASE: ${{ inputs.api_base }}
          LOAD_MODE: ${{ inputs.load_mode }}
        run: |
          python3 <<'PYEOF'
          import json, os
          cfg = {}
          if os.path.exists('capacitor.config.json'):
              with open('capacitor.config.json', encoding='utf-8') as f:
                  cfg = json.load(f)
          elif os.path.exists('capacitor.config.ts'):
              os.rename('capacitor.config.ts', 'capacitor.config.ts.bak')
          cfg['appId'] = os.environ['APP_ID']
          cfg['appName'] = os.environ['APP_NAME']
          cfg['webDir'] = os.environ['WEB_DIR']
          cfg['android'] = {**(cfg.get('android') or {}),
                            'allowMixedContent': False,
                            'webContentsDebuggingEnabled': False}
          server = {**(cfg.get('server') or {}), 'androidScheme': 'https'}
          server.pop('cleartext', None)
          if os.environ['LOAD_MODE'] == 'remote':
              # لود مستقیم سایت داخل WebView → کوکی‌ها مثل مرورگر کار می‌کنند
              server['url'] = os.environ['API_BASE']
          else:
              server.pop('url', None)
          cfg['server'] = server
          with open('capacitor.config.json', 'w', encoding='utf-8') as f:
              json.dump(cfg, f, indent=2, ensure_ascii=False)
          print('appId =', cfg['appId'], '| mode =', os.environ['LOAD_MODE'],
                '| server.url =', server.get('url', '(local assets)'))
          PYEOF

      - name: Ensure app icon exists (auto-draw if missing)
        working-directory: client
        run: |
          if command -v magick >/dev/null 2>&1; then MX="magick"; else MX="convert"; fi
          mkdir -p assets
          if [ ! -f assets/icon.png ]; then
            echo "🎨 Generating default icon (graduation cap)..."
            $MX -size 1024x1024 gradient:'#4a9bff-#0a5be0' \
              -fill white -stroke none \
              -draw "roundrectangle 322,470 702,742 80,80" \
              -draw "polygon 512,236 894,420 512,604 130,420" \
              -draw "rectangle 868,420 896,566" \
              -draw "circle 882,594 882,622" \
              -draw "polygon 858,616 906,616 890,712 874,712" \
              assets/icon.png
            echo "✅ assets/icon.png generated"
          else
            echo "✅ Using committed assets/icon.png"
          fi

      - name: Add Android platform (fresh)
        working-directory: client
        run: |
          rm -rf android
          npx cap add android

      - name: Harden manifest (no backup)
        working-directory: client/android
        run: |
          M=app/src/main/AndroidManifest.xml
          if grep -q 'android:allowBackup' "$M"; then
            sed -i 's/android:allowBackup="true"/android:allowBackup="false"/' "$M"
          else
            sed -i 's/<application /<application android:allowBackup="false" /' "$M"
          fi
          echo "✅ allowBackup=false"

      - name: Prepare signing keystore + fingerprint
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
            echo "KEYSTORE_PASS=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASS=${{ secrets.ANDROID_KEY_PASSWORD }}" >> $GITHUB_ENV
            echo "✅ Using keystore from secrets"
          else
            keytool -genkeypair -v \
              -keystore /tmp/release.keystore \
              -alias ms-app \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass msSecret2024 \
              -keypass msSecret2024 \
              -dname "CN=MS, OU=PayamCoder, O=PayamCoder, L=Tehran, ST=Tehran, C=IR" >/dev/null 2>&1
            echo "KEYSTORE_PASS=msSecret2024" >> $GITHUB_ENV
            echo "KEY_ALIAS=ms-app" >> $GITHUB_ENV
            echo "KEY_PASS=msSecret2024" >> $GITHUB_ENV
            echo "⚠️ Temporary keystore generated"
          fi
          echo "KEYSTORE_PATH=/tmp/release.keystore" >> $GITHUB_ENV

          FP=$(keytool -list -v \
                 -keystore /tmp/release.keystore \
                 -storepass "$KEYSTORE_PASS" \
                 -alias "$KEY_ALIAS" 2>/dev/null \
                 | grep -m1 "SHA256:" \
                 | sed 's/.*SHA256: *//' \
                 | tr -d ' :' | tr '[:lower:]' '[:upper:]')
          if [ ${#FP}
