name: Build PodmanBan APK

# Quality gates run on every push/PR/schedule; the APK itself is only
# built on manual dispatch (needs all gates green first).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      api_base:
        description: "آدرس سرور (بدون اسلش آخر) — باید https باشد"
        required: true
        default: "https://ms.payam-coder.ir"
      app_id:
        description: "Package Name"
        required: true
        default: "ir.payamcoder.podmanban"
      app_name:
        description: "نام اپلیکیشن"
        required: true
        default: "پودمان‌بان"
      version_name:
        description: "شماره نسخه"
        required: false
        default: "1.0.0"
      load_mode:
        description: "remote = لود مستقیم سایت | local = بیلد داخلی"
        required: false
        default: "remote"
      adhoc_sign:
        description: "امضای موقت بدون سکرت (فقط تست دستی — آپدیت بعدی روی آن نصب نمی‌شود)"
        required: false
        default: false
        type: boolean

# Least privilege: every job gets read-only contents by default; the
# security job elevates only what CodeQL needs (see below).
permissions:
  contents: read

# PR runs cancel each other (push a fix → the stale run stops); push /
# schedule / manual dispatch runs never cancel — a release build must
# never be killed by a second dispatch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Static analysis (SAST) — runs beside the build so findings never
  # block artifact upload, but are always visible under Security.
  security:
    name: CodeQL security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  client-quality:
    name: Client quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install client deps (reproducible, self-healing lock)
        working-directory: client
        run: |
          npm ci --no-audit --no-fund || {
            echo "⚠️ lock file هم‌گام نیست — بازسازی و تلاش مجدد"
            npm install --package-lock-only --no-audit --no-fund
            npm ci --no-audit --no-fund
          }

      - name: Typecheck + tests
        working-directory: client
        run: |
          npx tsc --noEmit
          npm run test --if-present

      # Fail the pipeline on high/critical dependency vulnerabilities
      # instead of deploying them silently.
      - name: Audit client dependencies
        working-directory: client
        run: npm audit --audit-level=high

  server-quality:
    name: Server quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Setup Bun (server tests need bunx for migrations)
        uses: oven-sh/setup-bun@v2

      - name: Install server deps (reproducible)
        working-directory: server
        run: npm ci

      - name: Typecheck + tests
        working-directory: server
        run: |
          npx tsc --noEmit
          npx vitest run

      - name: Audit server dependencies
        working-directory: server
        run: npm audit --audit-level=high

  build:
    name: Build release APK
    needs: [security, client-quality, server-quality]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate api_base is https
        run: |
          case "${{ inputs.api_base }}" in
            https://*) echo "✅ https OK" ;;
            *) echo "❌ api_base باید با https:// شروع شود (androidScheme=https + allowMixedContent=false)"; exit 1 ;;
          esac

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Install required SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "platforms;android-36" "build-tools;34.0.0" >/dev/null

      - name: Install ImageMagick + librsvg
        run: |
          sudo apt-get update -y
          sudo apt-get install -y imagemagick librsvg2-bin

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      # NOTE: android/ is regenerated every run (rm -rf + cap add), so
      # hashing its gradle files would key on nothing. The lockfile tracks
      # the Capacitor/Gradle plugin versions that actually shape the cache.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('client/package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install client deps (reproducible, self-healing lock)
        working-directory: client
        run: |
          npm ci --no-audit --no-fund || {
            echo "⚠️ lock file هم‌گام نیست — بازسازی و تلاش مجدد"
            npm install --package-lock-only --no-audit --no-fund
            npm ci --no-audit --no-fund
          }

      # --- notification smallIcon باید به آیکون تک‌رنگ اشاره کند، نه ic_launcher ---
      # (سورس از قبل ic_notification است؛ این sed فقط تور ایمنی برای رگرسیون است)
      - name: Fix notification smallIcon reference
        working-directory: client
        run: |
          grep -rl 'smallIcon: "ic_launcher"' src/lib | xargs -r sed -i 's/smallIcon: "ic_launcher"/smallIcon: "ic_notification"/g'
          echo "بررسی نهایی:"
          grep -rn 'smallIcon:' src/lib || true

      - name: Build web assets
        working-directory: client
        run: npm run build
        env:
          VITE_API_BASE: ${{ inputs.api_base }}

      - name: Detect webDir
        working-directory: client
        run: |
          if [ -d dist ]; then W=dist
          elif [ -d build ]; then W=build
          elif [ -d out ]; then W=out
          else W=dist; fi
          echo "WEB_DIR=$W" >> $GITHUB_ENV
          echo "webDir = $W"

      # Branded offline fallback (offline.html ships from client/public via
      # vite; regenerate here only if somehow missing). Capacitor shows it
      # through server.errorPath when the remote site is unreachable.
      - name: Ensure offline fallback page
        working-directory: client
        env:
          WEB_DIR: ${{ env.WEB_DIR }}
        run: |
          set -e
          if [ -f "$WEB_DIR/offline.html" ]; then
            echo "✅ offline.html already in $WEB_DIR"
            exit 0
          fi
          cat > "$WEB_DIR/offline.html" <<'EOF'
          <!DOCTYPE html>
          <html lang="fa" dir="rtl">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>عدم اتصال به اینترنت</title>
            <style>
              * { margin:0; padding:0; box-sizing:border-box; }
              body {
                min-height:100vh; display:flex; align-items:center; justify-content:center;
                font-family:Tahoma, sans-serif; text-align:center; padding:24px;
                background:linear-gradient(135deg,#18A8FF,#0878F9 50%,#003CCB); color:#fff;
              }
              .card { max-width:420px; width:100%; }
              .icon { width:110px; height:110px; margin:0 auto 24px; background:#fff;
                      border-radius:28px; display:flex; align-items:center; justify-content:center;
                      box-shadow:0 10px 30px rgba(0,0,0,.25); }
              .icon svg { width:70px; height:70px; }
              h1 { font-size:22px; margin-bottom:12px; }
              p { font-size:15px; opacity:.92; line-height:2; margin-bottom:28px; }
              button {
                border:none; outline:none; cursor:pointer; font-family:inherit; font-size:16px;
                background:#fff; color:#0878F9; font-weight:bold; padding:14px 44px;
                border-radius:14px; box-shadow:0 6px 18px rgba(0,0,0,.2);
              }
              button:active { transform:scale(.97); }
              .status { margin-top:18px; font-size:13px; opacity:.8; min-height:18px; }
            </style>
          </head>
          <body>
            <div class="card">
              <div class="icon">
                <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
                  <g fill="#0878F9">
                    <path d="M90 220L256 125L422 220L256 315L90 220Z"/>
                    <path fill-rule="evenodd" d="M150 260V320C150 365 197 390 256 390C315 390 362 365 362 320V260L256 325L150 260Z M175 285V320C175 340 210 355 256 355C302 355 337 340 337 320V285L256 335L175 285Z"/>
                    <circle cx="390" cy="325" r="18"/>
                    <path d="M375 345L405 345L414 395C405 410 375 410 366 395L375 345Z"/>
                  </g>
                  <path d="M390 210V310" stroke="#0878F9" stroke-width="14" stroke-linecap="round" fill="none"/>
                </svg>
              </div>
              <h1>به اینترنت متصل نیستی!</h1>
              <p>پودمان‌بان برای کار کردن به اینترنت نیاز دارد.<br>لطفاً اینترنت گوشی را روشن کن و دوباره تلاش کن.</p>
              <button onclick="retry()">تلاش مجدد</button>
              <div class="status" id="status"></div>
            </div>
            <script>
              // Same logic as client/public/offline.html (single source).
              // Retry navigates to the real server URL (injected below) so
              // the user never leaves the app WebView.
              var API_BASE = "__API_BASE__";
              function apiUrl() {
                return (typeof API_BASE === "string" && API_BASE.indexOf("https://") === 0)
                  ? API_BASE
                  : null;
              }
              function retry() {
                var u = apiUrl();
                if (u) location.href = u;
                else location.reload();
              }
              var s = document.getElementById('status');
              function upd() {
                s.textContent = navigator.onLine ? 'اینترنت وصل شد — در حال اتصال...' : 'در انتظار اتصال اینترنت...';
              }
              window.addEventListener('online', function(){ upd(); setTimeout(retry, 800); });
              window.addEventListener('offline', upd);
              setInterval(function(){ if (navigator.onLine) retry(); }, 5000);
              upd();
            </script>
          </body>
          </html>
          EOF
          echo "✅ offline.html generated in $WEB_DIR"

      # Bake the real server URL into the offline page so "retry" navigates
      # back inside the app WebView instead of reloading the error page
      # (which on some setups escapes to an external browser).
      - name: Inject api_base into offline page
        working-directory: client
        env:
          WEB_DIR: ${{ env.WEB_DIR }}
          API_BASE: ${{ inputs.api_base }}
        run: |
          sed -i "s#__API_BASE__#${API_BASE}#g" "$WEB_DIR/offline.html"
          grep -c "$API_BASE" "$WEB_DIR/offline.html"

      - name: Write Capacitor config (package name + cookies)
        working-directory: client
        env:
          APP_ID: ${{ inputs.app_id }}
          APP_NAME: ${{ inputs.app_name }}
          WEB_DIR: ${{ env.WEB_DIR }}
          API_BASE: ${{ inputs.api_base }}
          LOAD_MODE: ${{ inputs.load_mode }}
        run: |
          python3 <<'PYEOF'
          import json, os
          cfg = {}
          if os.path.exists('capacitor.config.json'):
              with open('capacitor.config.json', encoding='utf-8') as f:
                  cfg = json.load(f)
          elif os.path.exists('capacitor.config.ts'):
              os.rename('capacitor.config.ts', 'capacitor.config.ts.bak')
          cfg['appId'] = os.environ['APP_ID']
          cfg['appName'] = os.environ['APP_NAME']
          cfg['webDir'] = os.environ['WEB_DIR']
          # امنیت: بدون محتوای میکس (http)، بدون دیباگ وب‌ویو در ریلیز
          cfg['android'] = {**(cfg.get('android') or {}),
                            'allowMixedContent': False,
                            'webContentsDebuggingEnabled': False}
          # حیاتی برای لاگین: بدون این دو، document.cookie خالی است،
          # هدر x-csrf-token ست نمی‌شود و همه POST/PUT/DELETE ها 403 می‌خورند
          cfg['plugins'] = {
              **(cfg.get('plugins') or {}),
              'CapacitorCookies': {'enabled': True},
              'CapacitorHttp': {'enabled': True},
          }
          # منشأ وب‌ویو اندروید https://localhost می‌شود؛
          # سرور باید COOKIE_SAMESITE=none (+ Secure اجباری) بدهد.
          # errorPath: صفحه آفلاین برند هنگام unreachable بودن سایت.
          server = {**(cfg.get('server') or {}), 'androidScheme': 'https',
                    'errorPath': 'offline.html'}
          server.pop('cleartext', None)
          if os.environ['LOAD_MODE'] == 'remote':
              server['url'] = os.environ['API_BASE']
          else:
              server.pop('url', None)
          cfg['server'] = server
          with open('capacitor.config.json', 'w', encoding='utf-8') as f:
              json.dump(cfg, f, indent=2, ensure_ascii=False)
          print('appId =', cfg['appId'], '| mode =', os.environ['LOAD_MODE'])
          print('plugins =', json.dumps(cfg['plugins']))
          print('server.url =', server.get('url', '(local assets)'))
          print('server.errorPath =', server.get('errorPath'))
          PYEOF

      # --- مسیر اشتباه icon.svg را جبران کن ---
      - name: Normalize icon.svg path
        working-directory: client
        run: |
          mkdir -p assets
          if [ ! -f assets/icon.svg ]; then
            FOUND=$(find assets -maxdepth 4 -name "icon.svg" -type f | head -1)
            if [ -n "$FOUND" ]; then
              cp "$FOUND" assets/icon.svg
              echo "✅ icon.svg از $FOUND کپی شد"
            else
              echo "⚠️ هیچ icon.svg پیدا نشد — از آیکون پیش‌فرض استفاده می‌شود"
            fi
          fi

      - name: Prepare icon assets (SVG → PNG + notification icon)
        working-directory: client
        run: |
          set -e
          mkdir -p assets

          if [ -f assets/icon.svg ]; then
            rsvg-convert -w 1024 -h 1024 assets/icon.svg -o assets/icon.png
            echo "✅ icon.png از icon.svg رندر شد"
          fi
          if [ ! -f assets/icon.png ]; then
            echo "⚠️ نه SVG بود نه PNG → آیکون پیش‌فرض ساخته می‌شود"
            if command -v magick >/dev/null 2>&1; then MX="magick"; else MX="convert"; fi
            $MX -size 1024x1024 gradient:'#4a9bff-#0a5be0' \
              -fill white -stroke none \
              -draw "roundrectangle 322,470 702,742 80,80" \
              -draw "polygon 512,236 894,420 512,604 130,420" \
              -draw "rectangle 868,420 896,566" \
              -draw "circle 882,594 882,622" \
              -draw "polygon 858,616 906,616 890,712 874,712" \
              assets/icon.png
          fi

          cat > /tmp/notif.svg <<'EOF'
          <svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
            <g fill="#FFFFFF">
              <path d="M90 220L256 125L422 220L256 315L90 220Z"/>
              <path fill-rule="evenodd" d="M150 260V320C150 365 197 390 256 390C315 390 362 365 362 320V260L256 325L150 260Z M175 285V320C175 340 210 355 256 355C302 355 337 340 337 320V285L256 335L175 285Z"/>
              <circle cx="390" cy="325" r="18"/>
              <path d="M375 345L405 345L414 395C405 410 375 410 366 395L375 345Z"/>
            </g>
            <path d="M390 210V310" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" fill="none"/>
          </svg>
          EOF
          rsvg-convert -w 96 -h 96 /tmp/notif.svg -o /tmp/ic_notification.png
          echo "✅ notification icon master ready"

      - name: Add Android platform (fresh)
        working-directory: client
        run: |
          rm -rf android
          npx cap add android
          chmod +x android/gradlew

      - name: Harden manifest (no backup, no cleartext, notification permission)
        working-directory: client/android
        run: |
          M=app/src/main/AndroidManifest.xml
          if grep -q 'android:allowBackup' "$M"; then
            sed -i 's/android:allowBackup="true"/android:allowBackup="false"/' "$M"
          else
            sed -i 's/<application /<application android:allowBackup="false" /' "$M"
          fi
          if grep -q 'android:usesCleartextTraffic' "$M"; then
            sed -i 's/android:usesCleartextTraffic="true"/android:usesCleartextTraffic="false"/' "$M"
          else
            sed -i 's/<application /<application android:usesCleartextTraffic="false" /' "$M"
          fi
          if ! grep -q 'android.permission.POST_NOTIFICATIONS' "$M"; then
            sed -i '/<manifest /a\    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' "$M"
          fi
          echo "✅ allowBackup=false, usesCleartextTraffic=false, POST_NOTIFICATIONS added"

      # OAuth return path: after the system browser finishes the provider
      # flow, the server redirects to <appId>://oauth?ticket=… — this
      # intent-filter routes it back into the app (plain custom scheme,
      # no assetlinks needed). Must match the server's OAUTH_APP_SCHEME.
      - name: Register OAuth return scheme
        working-directory: client/android
        env:
          APP_ID: ${{ inputs.app_id }}
        run: |
          python3 - <<'PYEOF'
          import os
          p = "app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          scheme = os.environ["APP_ID"].strip().lower()
          assert scheme and scheme[0].isalpha(), "bad app_id for scheme"
          marker = f'android:scheme="{scheme}"'
          if marker not in s:
              block = (
                  "            <intent-filter>\n"
                  '                <action android:name="android.intent.action.VIEW" />\n'
                  '                <category android:name="android.intent.category.DEFAULT" />\n'
                  '                <category android:name="android.intent.category.BROWSABLE" />\n'
                  f'                <data android:scheme="{scheme}" />\n'
                  "            </intent-filter>"
              )
              assert "</intent-filter>" in s, "no intent-filter anchor in manifest"
              s = s.replace("</intent-filter>", "</intent-filter>\n" + block, 1)
              open(p, "w", encoding="utf-8").write(s)
          print("oauth return scheme:", scheme)
          PYEOF

      # --- compileSdk=36 (الزام androidx.core 1.17.0) ولی targetSdk=35 می‌ماند
      # تا رفتار runtime جدید ۳۶ (edge-to-edge اجباری) فعال نشود ---
      - name: Ensure SDK versions (compile=36, target=35)
        working-directory: client/android
        run: |
          V=variables.gradle
          [ -f "$V" ] || exit 0
          sed -i -E 's/(compileSdkVersion\s*=\s*)[0-9]+/\136/' "$V" || true
          sed -i -E 's/(targetSdkVersion\s*=\s*)[0-9]+/\135/' "$V" || true
          GP=gradle.properties
          [ -f "$GP" ] || GP=../gradle.properties
          grep -q 'suppressUnsupportedCompileSdk' "$GP" 2>/dev/null || echo 'android.suppressUnsupportedCompileSdk=36' >> "$GP"
          echo "--- variables.gradle ---"
          grep -E 'compileSdkVersion|targetSdkVersion|minSdkVersion' "$V" || true

      # Release builds REQUIRE real signing secrets. A throwaway keystore
      # is only ever minted for explicit ad-hoc test builds (adhoc_sign),
      # which upload under a distinct -adhoc name with short retention —
      # an ad-hoc APK can never update a store/production install.
      - name: Prepare signing keystore + fingerprint
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SEC_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SEC_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SEC_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -d > /tmp/release.keystore
            STORE_PASS="$SEC_STORE_PASS"
            ALIAS_NAME="$SEC_ALIAS"
            KEY_PASS_VAL="$SEC_KEY_PASS"
            echo "✅ Using keystore from secrets"
          elif [ "${{ inputs.adhoc_sign }}" = "true" ]; then
            ADHOC_PASS="$(openssl rand -hex 16)"
            keytool -genkeypair -v -keystore /tmp/release.keystore -alias podmanban-tmp -keyalg RSA -keysize 2048 -validity 30 -storepass "$ADHOC_PASS" -keypass "$ADHOC_PASS" -dname "CN=PodmanBan-Adhoc, OU=Test, O=Test, L=Tehran, ST=Tehran, C=IR" >/dev/null 2>&1
            STORE_PASS="$ADHOC_PASS"
            ALIAS_NAME="podmanban-tmp"
            KEY_PASS_VAL="$ADHOC_PASS"
            echo "⚠️ Ad-hoc keystore (test only — updates will NOT install over it)"
          else
            echo "❌ No signing secrets. Add ANDROID_KEYSTORE_* secrets or re-run with ad-hoc signing enabled."
            exit 1
          fi

          LIST_OUT=$(keytool -list -v -keystore /tmp/release.keystore -storepass "$STORE_PASS" -alias "$ALIAS_NAME" 2>&1 || true)
          FP=$(printf '%s' "$LIST_OUT" | grep -m1 'SHA256:' | sed 's/.*SHA256:[[:space:]]*//' | tr -d ' :' | tr '[:lower:]' '[:upper:]')

          if [ "${#FP}" -ne 64 ]; then
            echo "❌ Could not read certificate fingerprint"
            printf '%s\n' "$LIST_OUT" | head -5 || true
            exit 1
          fi

          {
            echo "KEYSTORE_PATH=/tmp/release.keystore"
            echo "KEYSTORE_PASS=$STORE_PASS"
            echo "KEY_ALIAS=$ALIAS_NAME"
            echo "KEY_PASS=$KEY_PASS_VAL"
            echo "CERT_FP=$FP"
          } >> "$GITHUB_ENV"

          echo "🔐 Cert fingerprint: $FP"

      - name: Inject anti-tamper signature guard
        working-directory: client
        env:
          APP_ID: ${{ inputs.app_id }}
          CERT_FP: ${{ env.CERT_FP }}
        run: |
          python3 <<'PYEOF'
          import os, glob

          fp = os.environ['CERT_FP'].replace(':', '').strip().upper()
          if len(fp) != 64:
              raise SystemExit('❌ fingerprint invalid')
          pkg = os.environ['APP_ID'].strip()
          digest = bytes.fromhex(fp)
          arr = ', '.join(str((b ^ 0x5A) & 0xFF) for b in digest)

          base = 'android/app/src/main/java/' + pkg.replace('.', '/')
          os.makedirs(base, exist_ok=True)
          for f in glob.glob(base + '/MainActivity.*'):
              os.remove(f)

          java = r'''
          package __PKG__;

          import android.content.pm.PackageInfo;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.Process;
          import java.security.MessageDigest;

          public class MainActivity extends com.getcapacitor.BridgeActivity {

              private static final int XOR = 0x5A;
              private static final int[] FP = {__ARR__};

              private boolean ok() {
                  try {
                      byte[] raw;
                      if (Build.VERSION.SDK_INT >= 28) {
                          PackageInfo p = getPackageManager().getPackageInfo(
                                  getPackageName(), PackageManager.GET_SIGNING_CERTIFICATES);
                          raw = p.signingInfo.getApkContentsSigners()[0].toByteArray();
                      } else {
                          PackageInfo p = getPackageManager().getPackageInfo(
                                  getPackageName(), PackageManager.GET_SIGNATURES);
                          raw = p.signatures[0].toByteArray();
                      }
                      byte[] d = MessageDigest.getInstance("SHA-256").digest(raw);
                      if (d.length != FP.length) return false;
                      for (int i = 0; i < d.length; i++) {
                          if (((d[i] ^ XOR) & 0xFF) != FP[i]) return false;
                      }
                      return true;
                  } catch (Throwable t) {
                      return false;
                  }
              }

              private void die() {
                  finishAffinity();
                  Process.killProcess(Process.myPid());
              }

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  if (!ok()) { die(); return; }
                  super.onCreate(savedInstanceState);
                  new Handler(Looper.getMainLooper()).postDelayed(new Runnable() {
                      @Override
                      public void run() { if (!ok()) die(); }
                  }, 5000);
              }

              @Override
              public void onResume() {
                  super.onResume();
                  if (!ok()) { die(); }
              }
          }
          '''
          java = java.replace('__PKG__', pkg).replace('__ARR__', arr)
          path = os.path.join(base, 'MainActivity.java')
          with open(path, 'w', encoding='utf-8') as f:
              f.write(java.strip() + '\n')
          print('🛡️ Signature guard injected →', path)
          PYEOF

      - name: Sync Capacitor
        working-directory: client
        run: npx cap sync android

      - name: Generate Android icons & splash
        working-directory: client
        run: |
          set -e
          if command -v magick >/dev/null 2>&1; then MX="magick"; else MX="convert"; fi
          RES=android/app/src/main/res
          ICON=assets/icon.png

          $MX "$ICON" -resize 1024x1024 \
            \( -size 1024x1024 xc:none -fill white -draw "roundrectangle 0,0 1023,1023 230,230" \) \
            -alpha set -compose DstIn -composite /tmp/icon_rounded.png

          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            den=${pair%%:*}; px=${pair##*:}
            dir="$RES/mipmap-$den"
            [ -d "$dir" ] || continue
            $MX /tmp/icon_rounded.png -resize ${px}x${px} "$dir/ic_launcher.png"
            $MX /tmp/icon_rounded.png -resize ${px}x${px} "$dir/ic_launcher_round.png"
            fp=$(( px * 225 / 100 ))
            inner=$(( fp * 66 / 100 ))
            $MX -size ${fp}x${fp} xc:none \
              \( /tmp/icon_rounded.png -resize ${inner}x${inner} \) \
              -gravity center -compose over -composite "$dir/ic_launcher_foreground.png"
            echo "  ✔ mipmap-$den"
          done

          grep -rl "ic_launcher_background" "$RES/values" 2>/dev/null | while read -r bg; do
            sed -i -E 's/(name="ic_launcher_background">)#[0-9A-Fa-f]+(<)/\1#0878F9\2/g' "$bg"
          done

          find "$RES" -name "splash.png" -type f | while read -r f; do
            dims=$($MX "$f" -format "%wx%h" info:)
            W=${dims%x*}; H=${dims#*x}
            S=$(( ( W < H ? W : H ) * 45 / 100 ))
            $MX -size ${W}x${H} xc:black \
              \( /tmp/icon_rounded.png -resize ${S}x${S} \) \
              -gravity center -compose over -composite "$f"
            echo "  ✔ $f (${W}x${H})"
          done

          for pair in mdpi:24 hdpi:36 xhdpi:48 xxhdpi:72 xxxhdpi:96; do
            den=${pair%%:*}; px=${pair##*:}
            dir="$RES/drawable-$den"
            mkdir -p "$dir"
            $MX /tmp/ic_notification.png -resize ${px}x${px} "$dir/ic_notification.png"
            echo "  ✔ drawable-$den/ic_notification.png"
          done
          mkdir -p "$RES/drawable"
          $MX /tmp/ic_notification.png -resize 24x24 "$RES/drawable/ic_notification.png"
          echo "✅ All icons & splash generated"

      - name: Set versionName / versionCode
        working-directory: client/android
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          python3 -c "
          import re, os
          p = 'app/build.gradle'
          s = open(p, encoding='utf-8').read()
          s = re.sub(r'versionName\s+\"[^\"]*\"', 'versionName \"%s\"' % os.environ['VERSION_NAME'], s)
          s = re.sub(r'versionCode\s+\d+', 'versionCode %s' % os.environ['VERSION_CODE'], s)
          open(p, 'w', encoding='utf-8').write(s)
          print('version:', os.environ['VERSION_NAME'], '| code:', os.environ['VERSION_CODE'])
          "

      # S25 و همه گوشی‌های ۶۴بیتی فقط با arm64-v8a نصب می‌شوند: خروجی باید
      # یک APK یونیورسال (همه ABIها داخل یک فایل) باشد، نه split-per-ABI.
      - name: Force universal APK (no ABI splits)
        working-directory: client/android
        run: |
          python3 - <<'PYEOF'
          import re
          p = 'app/build.gradle'
          s = open(p, encoding='utf-8').read()
          # هر splits { abi { ... } } را خنثی کن — خروجی split روی S25 نصب نمی‌شود
          s2, n = re.subn(r'splits\s*\{(?:[^{}]|\{[^{}]*\})*\}', '', s)
          if n:
              print(f'warning: removed {n} splits block(s) - universal enforced')
          # abiFilters محدودکننده را هم بردار تا همه ABIها بسته شوند
          # (فقط آرگومان‌ها، نه آکولاد پایانی خط — تعادل براکت‌ها حفظ شود)
          s2, m = re.subn(r'abiFilters\s+[^}\n]*', '', s2)
          if m:
              print(f'warning: removed {m} abiFilters line(s) - all ABIs packaged')
          if s2 != s:
              open(p, 'w', encoding='utf-8').write(s2)
          else:
              print('no splits/abiFilters - already universal')
          PYEOF

      - name: Build release APK
        working-directory: client/android
        run: ./gradlew clean assembleRelease

      - name: Sign APK (v1+v2, universal)
        working-directory: client/android
        run: |
          set -e
          # A true release build is UNSIGNED (Capacitor ships no release
          # keystore). If none exists, something already signed it (e.g. a
          # stale debug config) — signing over that yields dual-signature
          # APKs that fail on real devices. Fail loudly instead of guessing.
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name "*unsigned*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "❌ No unsigned release APK. Outputs:"
            ls -la app/build/outputs/apk/release/ || true
            exit 1
          fi
          if [ "$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | wc -l)" -ne 1 ]; then
            echo "❌ Expected exactly one release APK (no ABI splits). Outputs:"
            ls app/build/outputs/apk/release/
            exit 1
          fi
          echo "Signing: $APK"
          BT="$ANDROID_HOME/build-tools/34.0.0"
          "$BT/zipalign" -f 4 "$APK" aligned.apk
          # v1 (JAR) for old installers, v2 for Android 7+, v3 for 9+ —
          # all three on for max compatibility (S25 = Android 15).
          "$BT/apksigner" sign --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --ks "$KEYSTORE_PATH" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASS" --key-pass "pass:$KEY_PASS" \
            --out signed.apk aligned.apk
          "$BT/apksigner" verify signed.apk
          echo "✅ Signed: $(du -h signed.apk | cut -f1)"

      # Proof of universality: S25 needs lib/arm64-v8a inside the APK —
      # fail here with a clear message instead of on the user's phone.
      - name: Verify universal APK (S25-ready)
        working-directory: client/android
        run: |
          set -e
          BT="$ANDROID_HOME/build-tools/34.0.0"
          echo "--- package / sdk ---"
          "$BT/aapt" dump badging signed.apk | grep -E "^(package|sdkVersion|targetSdkVersion|native-code)" || true
          echo "--- native libs per ABI ---"
          unzip -l signed.apk | grep -E 'lib/(armeabi-v7a|arm64-v8a|x86|x86_64)/' | awk '{print $4}' | cut -d/ -f1-2 | sort -u
          if ! unzip -l signed.apk | grep -q 'lib/arm64-v8a/'; then
            echo "❌ lib/arm64-v8a missing — this APK can NOT install on S25. Check splits/abiFilters."
            exit 1
          fi
          echo "✅ arm64-v8a present (S25 OK)"
          "$BT/apksigner" verify --verbose --print-certs signed.apk

      - name: Upload APK (release)
        if: ${{ !inputs.adhoc_sign }}
        uses: actions/upload-artifact@v4
        with:
          name: podman-ban-release-apk
          path: client/android/signed.apk
          retention-days: 90

      - name: Upload APK (ad-hoc, short-lived)
        if: ${{ inputs.adhoc_sign }}
        uses: actions/upload-artifact@v4
        with:
          name: podman-ban-adhoc-apk
          path: client/android/signed.apk
          retention-days: 7
